name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel the previous run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Each job runs its task through Turborepo. The setup action restores the
# Turborepo cache for the job. A task whose inputs did not change since the
# last cached run is replayed from the cache and does not run again.
jobs:
  # Lint, format check, and typecheck read the source. They do not need a build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint fmt:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck

  # The tests run against the source. They do not need a build. The tests run
  # on each supported Node version. NODE_VERSION is part of the task hash, so
  # a cached result from one Node version is not replayed for another.
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm turbo run test
        env:
          NODE_VERSION: ${{ matrix.node }}

  # Build the package to .dist on the pinned Node version.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build

  # Run one coverage pass on the pinned Node version. Upload
  # .coverage/lcov.info to Codecov. .coverage is a cached output, so a cache
  # hit restores the report for the upload.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm turbo run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/lcov.info
          fail_ci_if_error: false
