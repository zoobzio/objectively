name: Release

# Start this workflow by hand from the Actions tab or with
# `gh workflow run Release`. The job applies the pending changesets, commits
# the version bump to the current branch, publishes to npm with OIDC, and
# pushes the tags.
on:
  workflow_dispatch:

# Do not cancel a release in progress. Queue the new run.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the version-bump commit and the tags
  id-token: write # OIDC trusted publishing and provenance attestation

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # The changelog generator needs the full history to find the commit for
      # each changeset.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # registry-url sets the npm registry for the OIDC token exchange. OIDC
      # needs Node 22.14 or later. .nvmrc satisfies this.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Apply the pending changesets: bump the versions, update the changelogs,
      # and delete the applied changeset files. The changelog generator uses
      # GITHUB_TOKEN to find the commit and PR for each changeset.
      - name: Version
        run: pnpm ci:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the version bump. If there are no pending changesets, skip the
      # commit. The Publish step then publishes any version that is not on npm.
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No pending changesets. Nothing to version."
          else
            git commit -m "chore: release"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Build and publish each version that is not on npm. OIDC replaces
      # NPM_TOKEN. Trusted publishing emits provenance.
      - name: Publish
        run: pnpm ci:release
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Push the tags that changeset publish made.
      - name: Push tags
        run: git push --tags
