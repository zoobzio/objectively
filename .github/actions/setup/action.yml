name: Setup
description: Install pnpm, Node, and the dependencies.

inputs:
  node-version:
    description: >-
      The Node version to install. If empty, read the version from .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the pnpm version from "packageManager" in package.json.
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    # If node-version is empty, setup-node reads node-version-file.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
