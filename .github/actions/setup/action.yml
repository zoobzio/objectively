name: Setup
description: Install pnpm, Node, the dependencies, and restore the Turborepo cache.

inputs:
  node-version:
    description: >-
      The Node version to install. If empty, read the version from .nvmrc.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the pnpm version from "packageManager" in package.json.
    - name: Set up pnpm
      uses: pnpm/action-setup@v4

    # If node-version is empty, setup-node reads node-version-file.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts

    # Turborepo writes its local cache to .turbo. Each job and each Node
    # version has its own key. The key ends with the commit SHA, so each run
    # saves a new entry. restore-keys falls back to the newest entry for the
    # same job, so a task whose inputs did not change is replayed from cache.
    - name: Restore Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-node${{ inputs.node-version || 'default' }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-node${{ inputs.node-version || 'default' }}-
